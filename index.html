<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Entrenador de Ritme Musical - Miquel Castellá</title>
  <!-- Canvas Confetti per a les animacions de ratxes -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      /* Mode fosc predeterminat */
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.9);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-orange: #f97316;
      --accent-red: #ef4444;
      --accent-gold: #eab308;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --notation-bg: #ffffff;
      --notation-border: #cbd5e1;
      --tap-bg-1: #1e293b;
      --tap-bg-2: #0f172a;
      --tap-active: #334155;
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(0, 0, 0, 0.12);
      --accent-blue: #0284c7;
      --accent-green: #16a34a;
      --accent-orange: #ea580c;
      --accent-red: #dc2626;
      --accent-gold: #ca8a04;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --notation-bg: #ffffff;
      --notation-border: #94a3b8;
      --tap-bg-1: #e2e8f0;
      --tap-bg-2: #cbd5e1;
      --tap-active: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden !important;
      position: fixed;
      top: 0;
      left: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: radial-gradient(circle at top center, var(--bg-color), #090d16);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      height: 100vh;
      height: 100dvh;
      padding: clamp(6px, 1.5vh, 14px) clamp(8px, 2vw, 18px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: clamp(4px, 1.2vh, 10px);
      overflow: hidden !important;
    }

    /* HEADER / PANELS */
    header {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: clamp(6px, 1vh, 10px) clamp(10px, 1.8vw, 16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(4px, 0.8vh, 8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      position: relative;
      flex-shrink: 0;
    }

    .theme-toggle-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: clamp(8px, 1.5vw, 14px);
      background: var(--tap-active);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: clamp(4px, 0.8vh, 8px) clamp(8px, 1.2vw, 12px);
      border-radius: 8px;
      font-size: clamp(0.75rem, 1.5vh, 0.9rem);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .theme-toggle-btn:hover {
      filter: brightness(1.1);
    }

    .app-title-area {
      text-align: center;
      width: 100%;
      padding-right: clamp(80px, 18vw, 120px);
    }

    .app-title {
      font-size: clamp(1rem, 2.4vh, 1.35rem);
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-subtitle {
      font-size: clamp(0.7rem, 1.5vh, 0.88rem);
      color: var(--accent-blue);
      font-weight: 700;
      margin-top: -1px;
    }

    .header-bottom {
      width: 100%;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: space-between;
      gap: clamp(6px, 1.2vw, 12px);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: clamp(4px, 0.8vh, 8px);
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: clamp(6px, 1.2vw, 12px);
    }

    .control-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(0.75rem, 1.5vh, 0.92rem);
      font-weight: 700;
      color: var(--text-sub);
    }

    select {
      background: var(--tap-active);
      color: var(--text-main);
      border: 1px solid rgba(255,255,255,0.25);
      padding: clamp(4px, 0.6vh, 7px) clamp(6px, 1vw, 10px);
      border-radius: 8px;
      font-size: clamp(0.78rem, 1.5vh, 0.95rem);
      font-weight: bold;
      outline: none;
      cursor: pointer;
      max-width: clamp(130px, 35vw, 240px);
    }

    select:focus {
      border-color: var(--accent-blue);
    }

    .bpm-badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: clamp(4px, 0.6vh, 6px) clamp(8px, 1.2vw, 12px);
      border-radius: 8px;
      font-size: clamp(0.78rem, 1.5vh, 0.95rem);
      font-weight: 800;
      white-space: nowrap;
    }

    /* STATS & AVATAR BAR */
    .stats-bar {
      display: flex;
      align-items: center;
      gap: clamp(4px, 1vw, 10px);
    }

    .stat-pill {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--card-border);
      padding: clamp(4px, 0.6vh, 7px) clamp(6px, 1vw, 10px);
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: clamp(0.72rem, 1.4vh, 0.88rem);
      white-space: nowrap;
    }

    .stat-pill span.label {
      color: var(--text-sub);
    }

    .stat-pill span.value {
      font-weight: 800;
      color: var(--text-main);
    }

    .multiplier-badge {
      background: rgba(234, 179, 8, 0.18);
      border: 1px solid rgba(234, 179, 8, 0.45);
      color: var(--accent-gold);
      padding: clamp(4px, 0.6vh, 6px) clamp(8px, 1.2vw, 12px);
      border-radius: 8px;
      font-size: clamp(0.75rem, 1.5vh, 0.92rem);
      font-weight: 900;
      transition: all 0.2s ease;
    }

    .multiplier-badge.active-mult {
      transform: scale(1.1);
      box-shadow: 0 0 12px rgba(234, 179, 8, 0.45);
    }

    /* AVATAR & BADGES ROW */
    .avatar-badges-row {
      display: flex;
      gap: clamp(6px, 1.2vw, 12px);
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .avatar-panel {
      display: flex;
      align-items: center;
      gap: clamp(6px, 1.2vw, 10px);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: clamp(4px, 0.8vh, 8px) clamp(8px, 1.5vw, 14px);
      flex-shrink: 0;
    }

    .avatar-icon {
      font-size: clamp(1.1rem, 2.6vh, 1.5rem);
      line-height: 1;
    }

    .avatar-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .avatar-name {
      font-size: clamp(0.7rem, 1.4vh, 0.85rem);
      font-weight: 800;
      color: var(--text-main);
      white-space: nowrap;
    }

    .avatar-bar-bg {
      width: clamp(55px, 15vw, 90px);
      height: clamp(4px, 0.8vh, 7px);
      background: rgba(255,255,255,0.12);
      border-radius: 4px;
      overflow: hidden;
    }

    .avatar-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-green);
      transition: width 0.3s ease;
    }

    /* BADGES PANEL */
    .badges-bar {
      display: flex;
      gap: clamp(3px, 0.8vw, 8px);
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: clamp(4px, 0.8vh, 8px) clamp(6px, 1.2vw, 12px);
      justify-content: center;
      flex-wrap: nowrap;
      overflow: hidden;
    }

    .badge-item {
      font-size: clamp(0.65rem, 1.3vh, 0.82rem);
      font-weight: 700;
      padding: clamp(2px, 0.5vh, 5px) clamp(5px, 1vw, 9px);
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
      color: var(--text-sub);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0.4;
      filter: grayscale(1);
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .badge-item.unlocked {
      opacity: 1;
      filter: none;
      background: rgba(34, 197, 94, 0.18);
      color: var(--accent-green);
      border-color: rgba(34, 197, 94, 0.45);
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.25);
    }

    /* PREPARATION & METRONOME LIGHTS */
    .prep-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(10px, 2.5vw, 20px);
      height: clamp(14px, 3vh, 26px);
      flex-shrink: 0;
    }

    .prep-dot {
      width: clamp(10px, 2.2vh, 16px);
      height: clamp(10px, 2.2vh, 16px);
      border-radius: 50%;
      background: var(--tap-active);
      border: 2px solid var(--text-sub);
      transition: all 0.1s ease;
    }

    .prep-dot.active {
      background: var(--accent-blue);
      border-color: #e0f2fe;
      box-shadow: 0 0 14px var(--accent-blue);
      transform: scale(1.35);
    }

    /* NOTATION DISPLAY AREA */
    .notation-card {
      background: var(--notation-bg);
      border-radius: 12px;
      padding: clamp(4px, 1vh, 8px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      flex-grow: 1;
      min-height: clamp(90px, 22vh, 160px);
      border: 1px solid var(--notation-border);
    }

    svg.stave-svg {
      width: 100%;
      height: 100%;
      max-height: 100%;
    }

    /* FEEDBACK TEXT OVERLAY */
    .feedback-overlay {
      position: absolute;
      top: clamp(6px, 1.2vh, 10px);
      right: clamp(8px, 1.8vw, 14px);
      font-size: clamp(0.85rem, 1.8vh, 1.15rem);
      font-weight: 800;
      padding: clamp(3px, 0.6vh, 6px) clamp(8px, 1.2vw, 12px);
      border-radius: 8px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-5px);
      transition: all 0.15s ease;
      z-index: 10;
    }

    .feedback-overlay.show {
      opacity: 1;
      transform: translateY(0);
    }

    .feedback-perfect { background: #dcfce7; color: #15803d; }
    .feedback-good { background: #e0f2fe; color: #0369a1; }
    .feedback-early { background: #ffedd5; color: #c2410c; }
    .feedback-late { background: #fee2e2; color: #b91c1c; }
    .feedback-miss { background: #f3f4f6; color: #4b5563; }

    /* ACTION & INTERACTION AREA */
    .action-panel {
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 1.2vh, 10px);
      flex-shrink: 0;
    }

    .main-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: clamp(10px, 2vh, 16px) clamp(14px, 2.5vw, 20px);
      border-radius: 10px;
      font-size: clamp(0.9rem, 2vh, 1.2rem);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.4);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .main-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .main-btn:active {
      transform: translateY(1px);
    }

    .main-btn.stop {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      box-shadow: 0 3px 10px rgba(220, 38, 38, 0.4);
    }

    .tap-pad {
      background: linear-gradient(180deg, var(--tap-bg-1), var(--tap-bg-2));
      border: 2px dashed rgba(255,255,255,0.3);
      border-radius: 12px;
      padding: clamp(10px, 2.2vh, 18px);
      width: 100%;
      color: inherit;
      font: inherit;
      text-align: center;
      cursor: pointer;
      transition: all 0.1s ease;
      min-height: clamp(60px, 14vh, 90px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .main-btn:focus-visible, .tap-pad:focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 2px;
    }

    .tap-pad:active, .tap-pad.active {
      background: var(--tap-active);
      border-color: var(--accent-blue);
      transform: scale(0.99);
    }

    .tap-pad-title {
      font-size: clamp(0.95rem, 2.2vh, 1.3rem);
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 3px;
    }

    .tap-pad-sub {
      font-size: clamp(0.68rem, 1.4vh, 0.85rem);
      color: var(--text-sub);
    }

    footer {
      text-align: center;
      font-size: clamp(0.62rem, 1.2vh, 0.78rem);
      color: var(--text-sub);
      padding-bottom: 2px;
      flex-shrink: 0;
    }

    /* MODAL RESULTS WITH STARS */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 100;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--bg-color);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: clamp(16px, 3.5vh, 28px);
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .modal-title {
      font-size: clamp(1.2rem, 2.5vh, 1.5rem);
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .modal-stars {
      font-size: clamp(1.8rem, 4vh, 2.5rem);
      margin-bottom: 8px;
      letter-spacing: 4px;
    }

    .modal-score {
      font-size: clamp(1.4rem, 3.2vh, 2rem);
      font-weight: 900;
      color: var(--accent-blue);
      margin-bottom: 14px;
    }

    .modal-stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 16px;
      background: rgba(15, 23, 42, 0.5);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    .modal-stat-item {
      display: flex;
      flex-direction: column;
    }

    .modal-stat-val {
      font-size: clamp(0.95rem, 2vh, 1.2rem);
      font-weight: 700;
      color: var(--text-main);
    }

    .modal-stat-lbl {
      font-size: clamp(0.65rem, 1.3vh, 0.8rem);
      color: var(--text-sub);
    }
  </style>
</head>
<body data-theme="dark">

  <div class="app-container">
    
    <!-- HEADER -->
    <header>
      <button class="theme-toggle-btn" id="theme-toggle" aria-label="Canviar tema visual">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span id="theme-label">Mode Clar</span>
      </button>

      <div class="app-title-area">
        <h1 class="app-title">ENTRENADOR DE RITME MUSICAL</h1>
        <div class="app-subtitle">Miquel Castellá</div>
      </div>
      <div class="header-bottom">
        <div class="controls-group">
          <div class="control-item">
            <label for="level-select">Nivell:</label>
            <select id="level-select">
              <option value="1">1 - Negres i Silencis (72 BPM)</option>
              <option value="2">2 - Corxeres (72 BPM)</option>
              <option value="3">3 - Negres, Corxeres i Silencis (72 BPM)</option>
              <option value="4">4 - Semicorxeres (60 BPM)</option>
              <option value="5">5 - Ritmes Mixtes Avançats (60 BPM)</option>
            </select>
          </div>

          <div class="control-item">
            <span class="bpm-badge" id="bpm-badge">72 BPM</span>
          </div>
        </div>

        <div class="stats-bar">
          <div class="stat-pill">
            <span class="label">Punts:</span>
            <span class="value" id="score-val">0</span>
          </div>
          <div class="stat-pill">
            <span class="label">Precisió:</span>
            <span class="value" id="acc-val">100%</span>
          </div>
          <div class="stat-pill">
            <span class="label">Ràtxa:</span>
            <span class="value" id="streak-val">0</span>
          </div>
          <div class="multiplier-badge" id="mult-badge">x1</div>
        </div>
      </div>
    </header>

    <!-- AVATAR & INSÍGNIES BAR -->
    <div class="avatar-badges-row">
      <div class="avatar-panel">
        <div class="avatar-icon" id="avatar-icon">🥚</div>
        <div class="avatar-info">
          <div class="avatar-name" id="avatar-name">Llavor Musical</div>
          <div class="avatar-bar-bg">
            <div class="avatar-bar-fill" id="avatar-bar-fill"></div>
          </div>
        </div>
      </div>

      <div class="badges-bar" id="badges-bar">
        <div class="badge-item" id="badge-5" title="Aconsegueix una ratxa de 5 encerts">🔥 5 Ratxa</div>
        <div class="badge-item" id="badge-10" title="Aconsegueix una ratxa de 10 encerts">⭐ 10 Ratxa</div>
        <div class="badge-item" id="badge-score" title="Supera els 500 punts totals">🏆 500 Pts</div>
      </div>
    </div>

    <!-- PREPARATION & METRONOME LIGHTS -->
    <div class="prep-container">
      <div class="prep-dot" id="dot-1"></div>
      <div class="prep-dot" id="dot-2"></div>
      <div class="prep-dot" id="dot-3"></div>
      <div class="prep-dot" id="dot-4"></div>
    </div>

    <!-- NOTATION DISPLAY -->
    <div class="notation-card" id="notation-card">
      <div class="feedback-overlay" id="feedback-overlay">Perfecte!</div>
      <svg class="stave-svg" id="stave-svg" viewBox="0 0 800 120" preserveAspectRatio="xMidYMid meet">
        <!-- RENDERED DYNAMICALLY VIA JS -->
      </svg>
    </div>

    <!-- ACTION & INTERACTION AREA -->
    <div class="action-panel">
      <button class="main-btn" id="start-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Començar Exercici
      </button>

      <button type="button" class="tap-pad" id="tap-pad" aria-label="Toca per marcar el ritme">
        <span class="tap-pad-title">TOCA AQUÍ O PREM ESPAI</span>
        <span class="tap-pad-sub">Manté el ritme exacte de la partitura</span>
      </button>
    </div>

    <footer>
      Entrenador de Ritme Musical • Lectura i Precisió en Temps Real
    </footer>

  </div>

  <!-- MODAL DE RESULTATS AMB ESTRELLES -->
  <div class="modal-backdrop" id="results-modal">
    <div class="modal-card">
      <div class="modal-title" id="modal-main-title">Exercici Completat!</div>
      <div class="modal-stars" id="modal-stars-val">⭐⭐⭐</div>
      <div class="modal-score" id="modal-score-val">+0 pts</div>
      <div class="modal-stats">
        <div class="modal-stat-item">
          <span class="modal-stat-val" id="modal-acc-val">0%</span>
          <span class="modal-stat-lbl">Precisió</span>
        </div>
        <div class="modal-stat-item">
          <span class="modal-stat-val" id="modal-hits-val">0/0</span>
          <span class="modal-stat-lbl">Encerts</span>
        </div>
        <div class="modal-stat-item">
          <span class="modal-stat-val" id="modal-streak-val">0</span>
          <span class="modal-stat-lbl">Max Ràtxa</span>
        </div>
      </div>
      <button class="main-btn" id="modal-next-btn" style="width:100%;">
        Següent Exercici
      </button>
    </div>
  </div>

  <script>
    /* MODE FOSC / CLAR */
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeLabel = document.getElementById('theme-label');
    const bodyEl = document.body;

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = bodyEl.getAttribute('data-theme');
      if (currentTheme === 'dark') {
        bodyEl.setAttribute('data-theme', 'light');
        themeLabel.textContent = 'Mode Fosc';
      } else {
        bodyEl.setAttribute('data-theme', 'dark');
        themeLabel.textContent = 'Mode Clar';
      }
    });

    /* AUDIO SYSTEM OPTIMIZED */
    let audioCtx = null;
    let snareNoiseBuffer = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSnare(accent = false, time = 0) {
      if (!audioCtx) return;
      const t = time || audioCtx.currentTime;
      if (!snareNoiseBuffer) {
        const duration = 0.15;
        const frameCount = Math.floor(audioCtx.sampleRate * duration);
        snareNoiseBuffer = audioCtx.createBuffer(1, frameCount, audioCtx.sampleRate);
        const noise = snareNoiseBuffer.getChannelData(0);
        for (let i = 0; i < frameCount; i++) {
          noise[i] = Math.random() * 2 - 1;
        }
      }

      const noiseSource = audioCtx.createBufferSource();
      noiseSource.buffer = snareNoiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(accent ? 1900 : 1550, t);
      filter.Q.setValueAtTime(0.8, t);
      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(accent ? 0.45 : 0.3, t);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      noiseSource.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);
      noiseSource.start(t);
      noiseSource.stop(t + 0.13);
    }

    function playTapFeedback(success = true) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      const t = audioCtx.currentTime;
      osc.type = success ? 'triangle' : 'sawtooth';
      osc.frequency.setValueAtTime(success ? 523.25 : 180, t);
      
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start(t);
      osc.stop(t + 0.07);
    }

    /* PATTERNS */
    const LEVEL_PATTERNS = {

    /* STATE VARIABLES */

    const handleUserTap = (e) => {
      if (e.type === 'keydown' && e.code !== 'Space') return;
      if (e.type === 'keydown' && e.repeat) return;
      if (e.type === 'keydown') e.preventDefault();

    /* GENERATE PATTERN & SVG */
    function generateExercise() {
      const patterns = LEVEL_PATTERNS[currentLevel];
      const selectedPattern = patterns[Math.floor(Math.random() * patterns.length)];
      
      const secondsPerBeat = 60 / currentBpm;
      let currentTime = 0;
      
      notesData = [];
      totalTargets = 0;

      const startX = 140;
      const endX = 740;
      const totalBeats = 4;
      
      selectedPattern.forEach((type, idx) => {
        let beats = 1;
        if (type === 'e') beats = 0.5;
        if (type === 's') beats = 0.25;

        const startBeat = currentTime;
        const noteStartTime = startBeat * secondsPerBeat;
        const noteEndTime = (startBeat + beats) * secondsPerBeat;
        
        const x = startX + (startBeat / totalBeats) * (endX - startX);
        const isTarget = type !== 'r';

        if (isTarget) totalTargets++;

        notesData.push({
          id: idx,
          type: type,
          beats: beats,
          startTimeSec: noteStartTime,
          endTimeSec: noteEndTime,
          x: x,
          isTarget: isTarget,
          evaluated: false,
          hit: false
        });

        currentTime += beats;
      });

      updateDisplayStats();
      renderSVG(selectedPattern);
    }

      notesData.forEach((note) => {

        group.setAttribute('id', `note-group-${note.id}`);

          restPath.setAttribute(
            'd',

             C ${note.x + 8} ${yHead - 16}, ${note.x + 7} ${yHead - 12}, ${note.x + 4} ${yHead - 8}
             L ${note.x - 1} ${yHead - 1}
             C ${note.x - 4} ${yHead + 2}, ${note.x - 2} ${yHead + 5}, ${note.x + 1} ${yHead + 8}
             L ${note.x + 4} ${yHead + 11}
             C ${note.x + 7} ${yHead + 14}, ${note.x + 4} ${yHead + 17}, ${note.x + 1} ${yHead + 18}`
          );
          restPath.setAttribute('stroke', '#0f172a');
          restPath.setAttribute('stroke-width', '4');
          restPath.setAttribute('stroke-linecap', 'round');
          restPath.setAttribute('stroke-linejoin', 'round');
          restPath.setAttribute('fill', 'none');
          group.appendChild(restPath);
        } else {
          const head = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
          head.setAttribute('cx', note.x);
          head.setAttribute('cy', yHead);
          head.setAttribute('rx', '6.5');
          head.setAttribute('ry', '5');
          head.setAttribute('transform', `rotate(-20 ${note.x} ${yHead})`);
          head.setAttribute('fill', '#0f172a');
          head.setAttribute('id', `note-head-${note.id}`);
          group.appendChild(head);

          if (note.type === 'q') {
            const stem = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            stem.setAttribute('x1', note.x + 5.5);
            stem.setAttribute('y1', yHead);

        staveSvg.appendChild(group);
      });

      let i = 0;
      while (i < notesData.length) {
        if (notesData[i].type === 'e' && i + 1 < notesData.length && notesData[i+1].type === 'e') {
          const n1 = notesData[i];
          const n2 = notesData[i+1];
          const yStem = 59 - 28;

          const stem1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          stem1.setAttribute('x1', n1.x + 5.5); stem1.setAttribute('y1', '59');
          stem1.setAttribute('x2', n1.x + 5.5); stem1.setAttribute('y2', yStem);
          stem1.setAttribute('stroke', '#0f172a'); stem1.setAttribute('stroke-width', '2');
          staveSvg.appendChild(stem1);

          const stem2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          stem2.setAttribute('x1', n2.x + 5.5); stem2.setAttribute('y1', '59');
          stem2.setAttribute('x2', n2.x + 5.5); stem2.setAttribute('y2', yStem);
          stem2.setAttribute('stroke', '#0f172a'); stem2.setAttribute('stroke-width', '2');
          staveSvg.appendChild(stem2);

          const beam = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          beam.setAttribute('x1', n1.x + 5.5); beam.setAttribute('y1', yStem);
          beam.setAttribute('x2', n2.x + 5.5); beam.setAttribute('y2', yStem);
          beam.setAttribute('stroke', '#0f172a'); beam.setAttribute('stroke-width', '4');
          staveSvg.appendChild(beam);

          i += 2;
        } else if (notesData[i].type === 's' && i + 3 < notesData.length && notesData[i+1].type === 's' && notesData[i+2].type === 's' && notesData[i+3].type === 's') {
          const n1 = notesData[i];
          const n4 = notesData[i+3];
          const yStem = 59 - 30;

          for (let k = 0; k < 4; k++) {
            const nk = notesData[i+k];
            const stem = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            stem.setAttribute('x1', nk.x + 5.5); stem.setAttribute('y1', '59');
            stem.setAttribute('x2', nk.x + 5.5); stem.setAttribute('y2', yStem);
            stem.setAttribute('stroke', '#0f172a'); stem.setAttribute('stroke-width', '2');
            staveSvg.appendChild(stem);

          beam1.setAttribute('stroke', '#0f172a'); beam1.setAttribute('stroke-width', '3.5');

          beam2.setAttribute('stroke', '#0f172a'); beam2.setAttribute('stroke-width', '3.5');
          staveSvg.appendChild(beam2);

          i += 4;

          i++;
        }

    function createSVGText(str, x, y, size, weight, color) {
      const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', x);
      txt.setAttribute('y', y);
      txt.setAttribute('font-size', size);
      txt.setAttribute('font-weight', weight);
      txt.setAttribute('fill', color);
      txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('dominant-baseline', 'central');
      txt.textContent = str;
      return txt;
    }

    /* EXERCISE RUNNER OPTIMIZED */
    let activeMetronomeTimer = null;
    const PERFECT_WINDOW_SEC = 0.06;
    const GOOD_WINDOW_SEC = 0.12;
    const TAP_WINDOW_SEC = 0.18;
    const MISS_FRAME_GRACE_SEC = 0.03;

    function startExercise() {
      isPlaying = true;
      setControlsLocked(true);
      startBtn.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        Aturar
      `;
      startBtn.classList.add('stop');

      hitTargets = 0;
      currentMaxStreak = currentStreak;
      pendingExerciseScore = 0;
      consecutivePerfects = 0;
      currentMultiplier = 1;
      exerciseHasStarted = true;
      
      updateDisplayStats();

      let prepBeat = 0;
      const secondsPerBeat = 60 / currentBpm;

      const runPrepClick = () => {
        if (!isPlaying) return;
        
        highlightDot(prepBeat);
        playSnare(prepBeat === 0);
        prepBeat++;

        if (prepBeat < 4) {
          prepTimer = setTimeout(runPrepClick, secondsPerBeat * 1000);
        } else {
          prepTimer = setTimeout(() => {
            startActiveReading();
          }, secondsPerBeat * 1000);
        }
      };

      runPrepClick();
    }

    function startActiveReading() {
      startTime = audioCtx.currentTime;
      const secondsPerBeat = 60 / currentBpm;
      const totalDuration = 4 * secondsPerBeat;

      let currentMetronomeBeat = 0;
      const scheduleMetronomeTicks = () => {
        if (!isPlaying) return;
        const elapsed = audioCtx.currentTime - startTime;
        const expectedTime = currentMetronomeBeat * secondsPerBeat;

        if (elapsed >= expectedTime && currentMetronomeBeat < 4) {
          highlightDot(currentMetronomeBeat);
          playSnare(currentMetronomeBeat === 0);
          currentMetronomeBeat++;
        }

        if (currentMetronomeBeat < 4 && isPlaying) {
          activeMetronomeTimer = requestAnimationFrame(scheduleMetronomeTicks);
        }
      };
      scheduleMetronomeTicks();

      const animate = () => {
        if (!isPlaying) return;

        const elapsedTime = audioCtx.currentTime - startTime;

        for (let i = 0; i < notesData.length; i++) {
          const note = notesData[i];
          if (note.isTarget && !note.evaluated) {
            if (elapsedTime > note.startTimeSec + TAP_WINDOW_SEC + MISS_FRAME_GRACE_SEC) {
              note.evaluated = true;
              note.hit = false;
              markNoteVisual(note.id, false);
              showFeedback('Fallat!', 'miss');
              currentStreak = 0;
              resetMultiplier();
              updateDisplayStats();
            }
          }
        }

        if (elapsedTime < totalDuration + 0.2) {
          animFrame = requestAnimationFrame(animate);
        } else {
          finishExercise();
        }
      };

      animFrame = requestAnimationFrame(animate);
    }

    /* REAL-TIME TAP EVALUATION */
    function evaluateTap() {
      const elapsedTime = audioCtx.currentTime - startTime;

      let closestNote = null;
      let minDiff = Infinity;

      for (let i = 0; i < notesData.length; i++) {
        const note = notesData[i];
        if (note.isTarget && !note.evaluated) {
          const diff = Math.abs(elapsedTime - note.startTimeSec);
          if (diff < minDiff) {
            minDiff = diff;
            closestNote = note;
          }
        }
      }

      if (closestNote && minDiff <= TAP_WINDOW_SEC) {
        closestNote.evaluated = true;

        if (minDiff <= PERFECT_WINDOW_SEC) {
          closestNote.hit = true;
          hitTargets++;
          currentStreak++;
          consecutivePerfects++;

          if (consecutivePerfects >= 6) currentMultiplier = 4;
          else if (consecutivePerfects >= 4) currentMultiplier = 3;
          else if (consecutivePerfects >= 2) currentMultiplier = 2;

          pendingExerciseScore += (100 + (currentStreak * 10)) * currentMultiplier;
          markNoteVisual(closestNote.id, true);
          showFeedback(`Perfecte! x${currentMultiplier}`, 'perfect');
          playTapFeedback(true);
          checkConfettiAndBadges();
        } else if (minDiff <= GOOD_WINDOW_SEC) {
          closestNote.hit = true;
          hitTargets++;
          currentStreak++;
          resetMultiplier();

          pendingExerciseScore += 60;
          
          const isEarly = elapsedTime < closestNote.startTimeSec;
          markNoteVisual(closestNote.id, true);
          showFeedback(isEarly ? "D'hora" : "Tard", isEarly ? 'early' : 'late');
          playTapFeedback(true);
          checkConfettiAndBadges();
        } else {
          closestNote.hit = false;
          currentStreak = 0;
          resetMultiplier();

          markNoteVisual(closestNote.id, false);
          showFeedback('Imprecís', 'miss');
          playTapFeedback(false);
        }

        if (currentStreak > currentMaxStreak) {
          currentMaxStreak = currentStreak;
        }

        updateDisplayStats();
      }
    }

    function resetMultiplier() {
      consecutivePerfects = 0;
      currentMultiplier = 1;
    }

    /* AVATAR & CONFETI SYSTEM */
    function updateAvatarDisplay() {
      let currentStage = AVATAR_STAGES[0];
      let nextStage = AVATAR_STAGES[1];

      for (let i = AVATAR_STAGES.length - 1; i >= 0; i--) {
        if (totalXP >= AVATAR_STAGES[i].minXP) {
          currentStage = AVATAR_STAGES[i];
          nextStage = AVATAR_STAGES[i + 1] || AVATAR_STAGES[i];
          break;
        }
      }

      avatarIcon.textContent = currentStage.icon;
      avatarName.textContent = currentStage.name;

      if (nextStage !== currentStage) {
        const xpInCurrent = totalXP - currentStage.minXP;
        const xpNeeded = nextStage.minXP - currentStage.minXP;
        const pct = Math.min(100, Math.round((xpInCurrent / xpNeeded) * 100));
        avatarBarFill.style.width = `${pct}%`;
      } else {
        avatarBarFill.style.width = '100%';
      }
    }

    function checkConfettiAndBadges() {
      if (currentStreak === 5 || currentStreak === 10) {
        if (typeof confetti === 'function') {
          confetti({
            particleCount: currentStreak === 10 ? 100 : 50,
            spread: 70,
            origin: { y: 0.6 }
          });
        }
      }

      if (currentStreak >= 5) {
        document.getElementById('badge-5').classList.add('unlocked');
      }
      if (currentStreak >= 10) {
        document.getElementById('badge-10').classList.add('unlocked');
      }
      if ((accumulatedScore + pendingExerciseScore) >= 500) {
        document.getElementById('badge-score').classList.add('unlocked');
      }
    }

    function markNoteVisual(noteId, success) {
      const head = document.getElementById(`note-head-${noteId}`);
      if (head) {
        head.setAttribute('fill', success ? '#22c55e' : '#ef4444');
      }
    }

    function showFeedback(text, type) {
      feedbackOverlay.textContent = text;
      feedbackOverlay.className = `feedback-overlay feedback-${type} show`;
      setTimeout(() => {
        feedbackOverlay.classList.remove('show');
      }, 350);
    }

    function updateDisplayStats() {
      const currentAcc = exerciseHasStarted && totalTargets > 0
        ? Math.round((hitTargets / totalTargets) * 100)
        : 100;
      scoreVal.textContent = accumulatedScore + pendingExerciseScore;
      accVal.textContent = `${currentAcc}%`;
      streakVal.textContent = currentStreak;

      multBadge.textContent = `x${currentMultiplier}`;
      if (currentMultiplier > 1) {
        multBadge.classList.add('active-mult');
      } else {
        multBadge.classList.remove('active-mult');
      }
    }

    function commitPendingScore() {
      accumulatedScore += pendingExerciseScore;
      totalXP += pendingExerciseScore;
      pendingExerciseScore = 0;
      scoreVal.textContent = accumulatedScore;
      updateAvatarDisplay();
      checkConfettiAndBadges();
    }

    function resetExerciseState() {
      pendingExerciseScore = 0;
      currentMaxStreak = 0;
      hitTargets = 0;
      exerciseHasStarted = false;
      resetMultiplier();
      updateDisplayStats();
    }

    function stopExercise(commitPartialScore = false) {
      isPlaying = false;
      clearTimeout(prepTimer);
      cancelAnimationFrame(animFrame);
      cancelAnimationFrame(activeMetronomeTimer);
      clearDots();
      if (commitPartialScore) commitPendingScore();
      setControlsLocked(false);

      startBtn.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Començar Exercici
      `;
      startBtn.classList.remove('stop');
    }

    function finishExercise() {
      stopExercise();
      setControlsLocked(true);

      const finalAcc = totalTargets > 0 ? Math.round((hitTargets / totalTargets) * 100) : 0;
      
      let stars = '⭐';
      if (finalAcc >= 95) stars = '⭐⭐⭐';
      else if (finalAcc >= 80) stars = '⭐⭐';

      modalMainTitle.textContent = 'Exercici Completat!';
      modalStarsVal.textContent = stars;
      modalScoreVal.textContent = `+${pendingExerciseScore} pts`;
      modalAccVal.textContent = `${finalAcc}%`;
      modalHitsVal.textContent = `${hitTargets}/${totalTargets}`;
      modalStreakVal.textContent = currentMaxStreak;
      modalNextBtn.textContent = 'Següent Exercici';

      resultsModal.classList.add('open');
    }

    updateBpmForLevel(currentLevel);
    updateAvatarDisplay();
    generateExercise();
  </script>
</body>
</html>
